# Hello world on Apache with PHP-FPM: /etc/apache2/sites-available/hello.conf, then a2ensite hello
<VirtualHost *:443>
    ServerName hello.example.com
    DocumentRoot /var/www/hello/public

    # The package's pages, scripts and styles (sign-in, policies, js/app.js, css/style.css)
    Alias /framework /usr/share/sc-webframe/public
    <Directory /usr/share/sc-webframe/public>
        Require all granted
    </Directory>

    # The settings file; keep it out of the document root, readable by PHP-FPM's user only
    SetEnv WEBFRAME_CONFIG /etc/hello/config.json

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/hello.example.com.pem
    SSLCertificateKeyFile /etc/ssl/private/hello.example.com.key
</VirtualHost>
